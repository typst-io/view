plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'io.typst.spigradle.spigot-base' version '4.0.2'
}

group = 'io.typst'

repositories {
    mavenLocal()
    mavenCentral()
    spigotRepos {
        spigotmc()
        papermc()
    }
}

dependencies {
    compileOnly commons.lombok
    annotationProcessor commons.lombok
    implementation 'org.jetbrains:annotations:26.0.2-1'
    api libs.inventory.core
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

javadoc {
    options.encoding = 'UTF-8'
}

compileJava {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

registerPublish(this)
