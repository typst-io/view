plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'io.typst.spigradle.spigot-base' version '4.0.2'
}

group = 'io.typst'

repositories {
    mavenLocal()
    mavenCentral()
    spigotRepos {
        spigotmc()
        papermc()
    }
}

dependencies {
    compileOnly commons.lombok
    annotationProcessor commons.lombok
    implementation 'org.jetbrains:annotations:26.0.2-1'
    api libs.inventory.core
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platformLauncher
}

javadoc {
    options.encoding = 'UTF-8'
}

compileJava {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

registerPublish(this)
