plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'io.typst.spigradle.spigot-base' version '4.0.2'
}

group = 'io.typst'

repositories {
    mavenLocal()
    mavenCentral()
    spigotRepos {
        spigotmc()
        papermc()
    }
}

dependencies {
    // NOTE: downgraded to 1.20.1 for compatibility
    compileOnly spigots.paper.api
    api project(':view-core')
    api libs.inventory.bukkit
    implementation 'org.jetbrains:annotations:26.0.2-1'
    compileOnly commons.lombok
    annotationProcessor commons.lombok
}

registerPublish(this)